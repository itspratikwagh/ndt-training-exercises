<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eddy Current Testing: Coaxial and Surface Probes</title>
<style>
:root{--ink:#111;--mute:#777;--line:#e6e6e6;--acc:#e1262c;--ok:#13895a;--bad:#d4372c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100vh;max-height:760px;max-width:1240px;margin:0 auto;display:grid;grid-template-rows:54px 1fr 62px;grid-template-columns:minmax(0,1fr)}
.app>*{min-width:0}
header{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);gap:16px}
.brand{font-weight:650;font-size:14px;white-space:nowrap}
.brand span{color:var(--mute);font-weight:400}
.dots{display:flex;gap:5px}
.dot{width:20px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.dot.done{background:var(--ink)}.dot.cur{background:var(--acc)}
main{display:grid;grid-template-columns:1fr 340px;min-height:0}
.stage{position:relative;min-height:0;border-right:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.panel{padding:22px 22px 14px;display:flex;flex-direction:column;gap:13px;min-height:0;overflow-y:auto}
.kicker{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute)}
h1{font-size:21px;line-height:1.22;font-weight:680;margin-top:-6px}
.lead{font-size:14px;line-height:1.5;color:#333}
.tasks{display:flex;flex-direction:column;gap:7px}
.task{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;transition:color .3s}
.task i{flex:0 0 16px;height:16px;border:1.5px solid var(--ink);border-radius:50%;margin-top:1px;position:relative;transition:background .25s}
.task.ok i{background:var(--ink)}
.task.ok i::after{content:"";position:absolute;left:4.2px;top:1.2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.task.ok{color:var(--mute)}
.ctrl{display:flex;flex-direction:column;gap:7px;font-size:13px}
.ctrl label{display:flex;justify-content:space-between;color:var(--mute)}
.ctrl b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ink)}
.seg{display:flex;border:1px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:8px 2px;font:inherit;font-size:12.5px;cursor:pointer;border-right:1px solid var(--ink);color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.note{font-size:12.5px;color:var(--mute)}
.pq{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.pq .q,.quiz .q{font-size:14px;font-weight:620;line-height:1.4;margin-bottom:2px}
.quiz{border-top:1px solid var(--line);padding-top:13px;display:flex;flex-direction:column;gap:7px;animation:rise .35s ease}
.opt{text-align:left;border:1px solid #d2d2d2;background:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-size:13.5px;line-height:1.35;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.pick{border-color:var(--ink);background:#f2f2f2;opacity:1}
.opt.right{border-color:var(--ok);background:#eef9f3;opacity:1}
.opt.wrong{border-color:var(--bad);background:#fdf2f1;opacity:1}
.opt:disabled{cursor:default;opacity:.5}
.opt.pick:disabled,.opt.right:disabled,.opt.wrong:disabled{opacity:1}
.fb{font-size:13.5px;line-height:1.45;font-weight:600}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.big{font-size:44px;font-weight:700;letter-spacing:-1px}
footer{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-top:1px solid var(--line);gap:12px}
.btn{font:inherit;font-size:14px;padding:9px 20px;border-radius:999px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff}
.btn.small{font-size:13px;padding:7px 14px;align-self:flex-start}
.btn:disabled{opacity:.22;cursor:default}
.hint{font-size:12.5px;color:var(--mute);text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-height:640px){.panel{gap:10px;padding-top:16px}h1{font-size:19px}.lead{font-size:13.5px}}
html:fullscreen .app{max-width:none;max-height:none}
html:-webkit-full-screen .app{max-width:none;max-height:none}
.hright{display:flex;align-items:center;gap:16px}
.fsbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.fsbtn:hover{border-color:var(--ink)}
.start{position:fixed;inset:0;background:#fff;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.start h2{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.3px}
.start p{color:#444;font-size:15px;line-height:1.5;max-width:460px}
.start .btn{font-size:16px;padding:12px 34px;margin-top:6px}
.start .note{min-height:16px}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:50% 50%}.stage{border-right:0;border-bottom:1px solid var(--line)}.panel{padding:14px 16px}h1{font-size:18px}.dot{width:10px}.brand span{display:none}header{padding:0 12px}.brand{min-width:0;overflow:hidden;text-overflow:ellipsis}.hright{gap:8px}}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="kicker">Eddy current · Interactive</div>
  <h2>Coaxial and Surface Probes</h2>
  <p>Eight short scenes that follow the video "Eddy Current Testing" (MaterialsScience2000, Hochschule Karlsruhe). In each scene, predict first, then test it.</p>
  <button class="btn primary" id="startbtn">Start</button>
  <div class="note" id="fsnote"></div>
</div>
<div class="app">
  <header>
    <div class="brand">Eddy Current Testing <span>· Coaxial &amp; surface probes</span></div>
    <div class="hright"><div class="dots" id="dots"></div><button class="fsbtn" id="fsb">Full screen</button></div>
  </header>
  <main>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="panel" id="panel"></div>
  </main>
  <footer>
    <button class="btn" id="back">Back</button>
    <div class="hint" id="hint"></div>
    <button class="btn primary" id="next">Next</button>
  </footer>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),panel=$('#panel');
const W=800,H=500,TAU=Math.PI*2;
const C={red:'#e1262c',redB:'#a3191d',blue:'#2c5191',blueB:'#1e3a6b',yel:'#f4d600',yelD:'#b89d00',yelT:'#d9b800',fld:'#7c9ecf',or:'#f07a1a',orS:'#bd5a0d',orT:'#f6a35b'};
const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
let view={s:1,ox:0,oy:0,d:1};
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));const s=Math.min(r.width/W,r.height/H);view={s,ox:(r.width-W*s)/2,oy:(r.height-H*s)/2,d};}
new ResizeObserver(resize).observe(cv);resize();
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-view.ox)/view.s,y:(e.clientY-r.top-view.oy)/view.s};}

/* ---------- drawing helpers ---------- */
function txt(s,x,y,o={}){ctx.save();ctx.font=`${o.w||400} ${o.size||13}px ${FONT}`;ctx.fillStyle=o.c||'#111';ctx.globalAlpha=o.a??1;ctx.textAlign=o.al||'left';ctx.textBaseline='middle';if(o.halo){ctx.strokeStyle=o.halo;ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillText(s,x,y);ctx.restore();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wire(pts,c){ctx.save();ctx.strokeStyle=c;ctx.lineWidth=2.6;ctx.lineJoin='miter';ctx.lineCap='butt';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();}
function head(x,y,dir,c,s=6){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x+dir*s,y);ctx.lineTo(x-dir*s*.7,y-s*.7);ctx.lineTo(x-dir*s*.7,y+s*.7);ctx.closePath();ctx.fill();}

/* analog meter, styled after the video */
const mk=(x,l1,l2)=>({x,l:[l1,l2],t:0,v:0,vel:0,fl:0});
function umeter(m,dt){const a=110*(m.t-m.v)-16*m.vel;m.vel+=a*dt;m.v+=m.vel*dt;if(Math.abs(m.vel)>.22)m.fl=1;else m.fl=Math.max(0,m.fl-dt*1.1);}
function terminal(cx,cy){ctx.fillStyle='#b5753f';ctx.fillRect(cx-6,cy-10,12,10);ctx.fillStyle='#e6ad78';ctx.beginPath();ctx.ellipse(cx,cy-10,6,2.6,0,0,TAU);ctx.fill();}
function meter(m){const x=m.x,y=320,w=120,h=150;
 ctx.fillStyle=C.orT;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12,y-10);ctx.lineTo(x+w+12,y-10);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();
 ctx.fillStyle=C.orS;ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+12,y-10);ctx.lineTo(x+w+12,y+h-10);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
 ctx.fillStyle=C.or;ctx.fillRect(x,y,w,h);
 terminal(x+44,y-5);terminal(x+86,y-5);
 ctx.fillStyle='#fff';ctx.fillRect(x+10,y+10,w-20,74);ctx.strokeStyle='#8f8f8f';ctx.lineWidth=1.5;ctx.strokeRect(x+10,y+10,w-20,74);
 const px=x+w/2,py=y+80,a0=Math.PI+.42,a1=TAU-.42;
 ctx.beginPath();ctx.arc(px,py,52,a0,a1);ctx.arc(px,py,35,a1,a0,true);ctx.closePath();ctx.fillStyle='#c6c6c6';ctx.fill();ctx.strokeStyle='#8d8d8d';ctx.lineWidth=1;ctx.stroke();
 const a=a0+clamp(m.v,-.02,1.03)*(a1-a0),ca=Math.cos(a),sa=Math.sin(a);
 if(m.fl>.04){const tx=px+ca*56,ty=py+sa*56;ctx.save();ctx.globalAlpha=m.fl;ctx.translate(tx,ty);ctx.rotate(a);ctx.fillStyle=C.yel;ctx.strokeStyle='#333';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(3,0);ctx.lineTo(15,-8);ctx.lineTo(15,-3.5);ctx.lineTo(34,-3.5);ctx.lineTo(34,3.5);ctx.lineTo(15,3.5);ctx.lineTo(15,8);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
 ctx.strokeStyle='#111';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+ca*56,py+sa*56);ctx.stroke();
 ctx.fillStyle='#111';ctx.fillRect(x+8,y+92,w-16,50);
 txt(m.l[0],px,y+108,{c:'#fff',w:700,size:15,al:'center'});txt(m.l[1],px,y+127,{c:'#fff',w:700,size:15,al:'center'});}
function source(x,sym){const y=380,w=170,h=85;
 ctx.fillStyle='#cdc893';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+14,y-12);ctx.lineTo(x+w+14,y-12);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();
 ctx.fillStyle='#7d7949';ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+14,y-12);ctx.lineTo(x+w+14,y+h-12);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
 ctx.fillStyle='#a8a36b';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#6c683c';ctx.lineWidth=1.2;ctx.strokeRect(x,y,w,h);
 ctx.fillStyle='#e9e7c9';ctx.fillRect(x+10,y+12,w-20,h-24);ctx.strokeStyle='#6c683c';ctx.strokeRect(x+10,y+12,w-20,h-24);
 txt('Voltage',x+56,y+33,{w:700,size:15,al:'center'});txt('source',x+56,y+52,{w:700,size:15,al:'center'});
 txt(sym,x+127,y+31,{w:700,size:20,c:C.red,al:'center'});
 for(const tx of [x+112,x+142]){ctx.fillStyle='#222';ctx.beginPath();ctx.arc(tx,y+56,8.5,0,TAU);ctx.fill();ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(tx,y+56,6.5,0,TAU);ctx.fill();}}

/* charts */
const BX=()=>new Float32Array(801).fill(NaN);
function rec(b,x0,x1,v0,v1){x0=Math.round(clamp(x0,0,800));x1=Math.round(clamp(x1,0,800));if(isNaN(v0)||Math.abs(x1-x0)>140){b[x1]=v1;return;}const n=Math.abs(x1-x0);for(let i=0;i<=n;i++){const t=n?i/n:1;b[x0+(x1>x0?i:-i)]=lerp(v0,v1,t);}}
function frameBox(x,y,w,h,label){ctx.save();ctx.globalAlpha=.94;ctx.fillStyle='#fff';ctx.fillRect(x,y,w,h);ctx.restore();ctx.strokeStyle='#d4d4d4';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w,h);txt(label,x+8,y+11,{size:11.5,c:'#555'});}
function pchart(x,y,w,h,series,label,signed,mark){frameBox(x,y,w,h,label);const top=y+20,hh=h-26;
 if(signed){ctx.setLineDash([3,4]);ctx.strokeStyle='#cfcfcf';ctx.beginPath();ctx.moveTo(x,top+hh/2);ctx.lineTo(x+w,top+hh/2);ctx.stroke();ctx.setLineDash([]);}
 if(mark!==undefined){ctx.strokeStyle='#e2e2e2';ctx.beginPath();ctx.moveTo(mark,y+18);ctx.lineTo(mark,y+h);ctx.stroke();}
 for(const s of series){ctx.strokeStyle=s.c;ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();let pen=false;for(let i=Math.ceil(x);i<=x+w;i++){const v=s.b[i];if(isNaN(v)){pen=false;continue;}const t=signed?(v+1)/2:v,Y=top+hh-clamp(t,0,1)*hh;pen?ctx.lineTo(i,Y):ctx.moveTo(i,Y);pen=true;}ctx.stroke();}
 let lx=x+w-10;for(const s of [...series].reverse()){if(!s.name)continue;ctx.font=`400 11px ${FONT}`;const tw=ctx.measureText(s.name).width;lx-=tw;txt(s.name,lx,y+11,{size:11,c:'#555'});ctx.fillStyle=s.c;ctx.fillRect(lx-16,y+10,11,3);lx-=26;}}
function tchart(x,y,w,h,arr,label,c){frameBox(x,y,w,h,label);const top=y+20,hh=h-26,n=arr.length;if(n<2)return;ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<n;i++){const X=x+w-(n-1-i)*(w/299),Y=top+hh-clamp(arr[i],0,1)*hh;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();}

/* magnetic field lines of the coil (axis horizontal) */
function field(cx,cy,alpha,dir){if(alpha<.02)return;ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=C.fld;ctx.lineWidth=1.4;
 ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();
 for(const L of [50,84,130,196,290,420])for(const s of [1,-1]){ctx.beginPath();for(let i=0;i<=140;i++){const th=.03+i/140*(Math.PI-.06),r=L*Math.sin(th)**2,X=cx+r*Math.cos(th),Y=cy-s*r*Math.sin(th);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();if(Math.abs(dir)>.05)head(cx,cy-s*L,-Math.sign(dir),C.fld,6);}
 if(Math.abs(dir)>.05){head(cx+80,cy,Math.sign(dir),C.fld,6);}
 ctx.restore();}

/* coaxial geometry */
const TY=105,TR=30,CRY=38;
function coilX(xc,n,sp){const a=[];for(let i=0;i<n;i++)a.push(xc+(i-(n-1)/2)*sp);return a;}
function coilBack(xc,n,sp,c,full){for(const x of coilX(xc,n,sp)){ctx.strokeStyle=full?c:c;ctx.globalAlpha=full?1:.75;ctx.lineWidth=full?2.6:2;ctx.beginPath();ctx.ellipse(x,TY,8,CRY,0,Math.PI/2,Math.PI*1.5);ctx.stroke();}ctx.globalAlpha=1;}
function coilFront(xc,n,sp,c){const xs=coilX(xc,n,sp);for(const x of xs){ctx.strokeStyle=c;ctx.lineWidth=2.6;ctx.beginPath();ctx.ellipse(x,TY,8,CRY,0,-Math.PI/2,Math.PI/2);ctx.stroke();}return [xs[0],xs[xs.length-1]];}
function tube(x0,x1,cuts){const g=ctx.createLinearGradient(0,TY-TR,0,TY+TR);g.addColorStop(0,'#737373');g.addColorStop(.32,'#b3b3b3');g.addColorStop(.6,'#888');g.addColorStop(1,'#393939');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x0,TY-TR);ctx.lineTo(x1,TY-TR);ctx.lineTo(x1,TY+TR);ctx.lineTo(x0,TY+TR);ctx.ellipse(x0,TY,9,TR,0,Math.PI/2,Math.PI*1.5);ctx.closePath();ctx.fill();
 ctx.fillStyle='#6b6b6b';ctx.beginPath();ctx.ellipse(x1,TY,9,TR,0,0,TAU);ctx.fill();ctx.fillStyle='#1d1d1d';ctx.beginPath();ctx.ellipse(x1,TY,6,TR-4,0,0,TAU);ctx.fill();
 ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;ctx.lineCap='butt';
 for(const c of cuts){ctx.beginPath();if(c.t==='L'){ctx.moveTo(c.a,TY);ctx.lineTo(c.b,TY);}else ctx.ellipse(c.a,TY,3,TR*.62,0,-Math.PI/2,Math.PI/2);ctx.stroke();}}
/* dashed eddy current loop; wings stretch along a cut (w = 0 gives a plain loop) */
function eddyStroke(ph,a){ctx.save();ctx.globalAlpha=a;ctx.setLineDash([7,5]);ctx.lineDashOffset=-ph;ctx.strokeStyle=C.yelD;ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle=C.yel;ctx.lineWidth=2.2;ctx.stroke();ctx.restore();}
function loopPath(P,ca,cb,re,L,R,wb,w){const M=(a,b)=>P(a,b);const q=(c,e)=>{const p=M(c[0],c[1]),f=M(e[0],e[1]);ctx.quadraticCurveTo(p[0],p[1],f[0],f[1]);};
 const t=M(ca,cb+re);ctx.beginPath();ctx.moveTo(t[0],t[1]);
 q([lerp(L,ca-re*.9,w),lerp(cb+re,wb+(cb+re-wb)*.12,w)],[L,wb]);q([lerp(L,ca-re*.9,w),lerp(cb-re,wb-(wb-cb+re)*.12,w)],[ca,cb-re]);
 q([lerp(R,ca+re*.9,w),lerp(cb-re,wb-(wb-cb+re)*.12,w)],[R,wb]);q([lerp(R,ca+re*.9,w),lerp(cb+re,wb+(cb+re-wb)*.12,w)],[ca,cb+re]);ctx.closePath();}
function eddyCoax(xc,str,A,xa,xb,reach,ph){if(str<.03)return;const rx=13,L=xc-rx-A*clamp(xc-xa,0,reach),R=xc+rx+A*clamp(xb-xc,0,reach);
 loopPath((a,b)=>[a,TY-(b-0)],xc,0,TR+5,Math.min(L,xc-rx),Math.max(R,xc+rx),0,A);eddyStroke(ph,str);}

/* sheet geometry: oblique view, u to the right, v into the page */
const PS=(u,v)=>[100+u+.7*v,205-.5*v];
const SU=480,SV=200,VS=100,XO=PS(0,VS)[0];
function sheet(cuts){const p=[PS(0,0),PS(SU,0),PS(SU,SV),PS(0,SV)];const g=ctx.createLinearGradient(0,p[2][1],0,p[0][1]);g.addColorStop(0,'#9a9a9a');g.addColorStop(1,'#7a7a7a');
 ctx.fillStyle=g;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();
 ctx.fillStyle='#5c5c5c';ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);ctx.lineTo(p[1][0],p[1][1]);ctx.lineTo(p[1][0],p[1][1]+9);ctx.lineTo(p[0][0],p[0][1]+9);ctx.closePath();ctx.fill();
 ctx.fillStyle='#4a4a4a';ctx.beginPath();ctx.moveTo(p[1][0],p[1][1]);ctx.lineTo(p[2][0],p[2][1]);ctx.lineTo(p[2][0],p[2][1]+9);ctx.lineTo(p[1][0],p[1][1]+9);ctx.closePath();ctx.fill();
 for(const c of cuts){const w=3.2;let q;if(c.ax==='u')q=[PS(c.a,c.at-w),PS(c.b,c.at-w),PS(c.b,c.at+w),PS(c.a,c.at+w)];else q=[PS(c.at-w,c.a),PS(c.at+w,c.a),PS(c.at+w,c.b),PS(c.at-w,c.b)];ctx.fillStyle='#262626';ctx.beginPath();q.forEach((r,i)=>i?ctx.lineTo(r[0],r[1]):ctx.moveTo(r[0],r[1]));ctx.closePath();ctx.fill();}}

 upd(dt){const s=this.sig();S.tr.push([s.x,s.y]);if(S.tr.length>320)S.tr.shift();S.yt.push(s.y);if(S.yt.length>170)S.yt.shift();const sd=s.p<-1.6?-1:s.p>1.6?1:0;if(sd&&sd!==S.side){if(S.side&&S.lift<.15&&S.rotOK)S.swept=true;S.side=sd;}},
 draw(){const P=this.P8,s=this.sig();const c=[P(0,0),P(420,0),P(420,160),P(0,160)];ctx.fillStyle='#b9bcc0';ctx.beginPath();c.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fill();
  ctx.fillStyle='#8d9095';ctx.beginPath();ctx.moveTo(c[0][0],c[0][1]);ctx.lineTo(c[1][0],c[1][1]);ctx.lineTo(c[1][0],c[1][1]+8);ctx.lineTo(c[0][0],c[0][1]+8);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();const a=P(210,30),b=P(210,130);ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();txt('Crack',b[0]+6,b[1]-4,{size:12,c:'#333'});
  const base=P(S.u,80),tipY=base[1]-S.lift*34;ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(base[0],base[1],9+S.lift*4,3.5,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#333';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(base[0],tipY-96);ctx.bezierCurveTo(base[0],tipY-130,base[0]+90,tipY-120,base[0]+150,tipY-135);ctx.stroke();
  const gr=ctx.createLinearGradient(base[0]-9,0,base[0]+9,0);gr.addColorStop(0,'#8e9399');gr.addColorStop(.45,'#e4e7ea');gr.addColorStop(1,'#80858b');ctx.fillStyle=gr;ctx.fillRect(base[0]-8,tipY-96,16,84);ctx.beginPath();ctx.moveTo(base[0]-8,tipY-12);ctx.lineTo(base[0]+8,tipY-12);ctx.lineTo(base[0]+3,tipY);ctx.lineTo(base[0]-3,tipY);ctx.closePath();ctx.fill();
  txt('Probe',base[0]-14,tipY-80,{size:12,c:'#333',al:'right'});
  ctx.fillStyle='#2d2f31';rr(92,198,616,294,18);ctx.fill();ctx.fillStyle='#f4f5f1';rr(106,210,588,270,6);ctx.fill();
  const panes=[[116,236,170,232,'Y over time'],[296,236,388,232,'Impedance plane']];
  for(const q of panes){ctx.strokeStyle='#dde0da';ctx.lineWidth=1;for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(q[0]+q[2]*i/8,q[1]);ctx.lineTo(q[0]+q[2]*i/8,q[1]+q[3]);ctx.stroke();}for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(q[0],q[1]+q[3]*i/6);ctx.lineTo(q[0]+q[2],q[1]+q[3]*i/6);ctx.stroke();}ctx.strokeStyle='#b9bdb5';ctx.strokeRect(q[0]+.5,q[1]+.5,q[2],q[3]);txt(q[4],q[0]+2,q[1]-11,{size:11.5,c:'#666'});}
  const cx=296+194,cy=236+116,sc=110,cxl=116+85;ctx.strokeStyle='#9aa0a6';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(296,cy);ctx.lineTo(684,cy);ctx.moveTo(cx,236);ctx.lineTo(cx,468);ctx.moveTo(cxl,236);ctx.lineTo(cxl,468);ctx.stroke();
  ctx.save();ctx.beginPath();ctx.rect(296,236,388,232);ctx.clip();ctx.strokeStyle='#2f5fb3';ctx.lineWidth=1.8;ctx.beginPath();S.tr.forEach((t,i)=>{const X=cx+t[0]*sc,Y=cy-t[1]*sc;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.stroke();ctx.fillStyle='#173a86';ctx.beginPath();ctx.arc(cx+s.x*sc,cy-s.y*sc,4.2,0,TAU);ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(116,236,170,232);ctx.clip();ctx.strokeStyle='#2f5fb3';ctx.lineWidth=1.8;ctx.beginPath();const n=S.yt.length;S.yt.forEach((y,i)=>{const X=cxl+y*70,Y=236+(n-1-i)*(232/169);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.stroke();ctx.restore();},
 over(p){const b=this.P8(S.u,80);return Math.abs(p.x-b[0])<30&&p.y<b[1]+10&&p.y>b[1]-140;},down(p){if(this.over(p)){S.drag=true;S.o=p.x-this.P8(S.u,80)[0];}},move(p){if(S.drag)S.u=clamp(p.x-S.o-184,10,410);},up(){S.drag=false;}}
};

/* ---------- steps ---------- */
const seg=(id,opts,val)=>`<div class="seg" id="${id}">${opts.map(o=>`<button data-v="${o[0]}" class="${o[0]==val?'on':''}">${o[1]}</button>`).join('')}</div>`;
const bindSeg=(id,fn)=>{const el=$('#'+id);if(!el)return;el.querySelectorAll('button').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.v);});};
const STEPS=[
{scene:'coil',kicker:'Scene 1 · Electromagnetic induction',title:'A coil on DC and on AC',
 lead:'A coil is wired through a current meter to a voltage source. Switch between DC and AC at the same voltage and watch the current meter and the blue magnetic field lines.',
 pq:'Same voltage, but switched from DC to AC. The current through the coil will be:',po:['Higher than on DC','Lower than on DC','The same as on DC'],pa:1,
 why:'On DC the current climbs quickly at first, then slowly, until only the coil\'s ohmic resistance limits it. On AC the magnetic field never stops changing, so self-induction creates a counter voltage in the coil that holds the current down. This demo runs at a very low frequency so you can watch the field flip; real instruments work at kilohertz.',
 controls:()=>`<div class="ctrl"><label>Voltage source</label>${seg('mode',[['off','Off'],['dc','DC'],['ac','AC']],S.mode)}</div>`,bind(){bindSeg('mode',v=>S.mode=v);},
 tasks:[{id:'dc',text:'Switch on DC and wait for the current to level off.'},{id:'ac',text:'Switch to AC.'}],
 tick(){if(S.mode==='dc'&&S.I>.93)done('dc');if(S.mode==='ac'&&S.I<.4)done('ac');}},
{scene:'push',kicker:'Scene 2 · Eddy currents',title:'Push a tube through the coil',
 lead:'The coil runs on AC. Drag the tube to the left, through the coil. The tube is austenitic (nonmagnetic) stainless steel with a saw cut along its length.',
 pq:'When the conductive tube enters the coil, the coil current will:',po:['Rise','Drop','Stay the same'],pa:0,
 why:'The coil\'s field induces an eddy current that circles the tube. The eddy current\'s own field opposes the coil\'s field, which lowers the coil\'s self-induction, so the current rises. At the cut the eddy current has to flow around it. Its path is longer and its resistance higher, so it weakens and the coil current drops again.',
 tasks:[{id:'in',text:'Push the tube into the coil.'},{id:'cut',text:'Keep pushing until the cut passes through the coil.'}],
 tick(){if(S.fill>.95)done('in');if(state[cur].tasks.in&&S.A>.8)done('cut');}},
{scene:'scan',kicker:'Scene 3 · Coaxial probe',title:'Scan a tube with one encircling coil',
 lead:'Now the tube stays put and you drag the coil along it. The tube has two saw cuts: one along its length and one around its circumference. The chart records the coil current at every position.',
 pq:'Which cut will change the coil current?',po:['Both cuts','Only the lengthwise cut','Only the circumferential cut'],pa:1,
 why:'The eddy current flows around the circumference. The lengthwise cut blocks that path, so the current drops. The circumferential cut runs along the flow lines and barely disturbs them, so a coaxial coil cannot see it. Crack-like flaws that run along the eddy current flow go undetected.',
 controls:()=>`<button class="btn small" id="clr">Clear trace</button>`,bind(){const b=$('#clr');if(b)b.onclick=()=>{S.b=BX();S.pv=NaN;};},
 tasks:[{id:'long',text:'Drag the coil past the lengthwise cut.'},{id:'circ',text:'Drag the coil past the circumferential cut.'}],
 tick(){const has=(a,b)=>{for(let i=a;i<=b;i+=4)if(isNaN(S.b[i]))return false;return true;};if(has(286,398))done('long');if(has(580,620))done('circ');}},
{scene:'diff',kicker:'Scene 4 · Coaxial probe',title:'One excitation coil, two receiver coils',
 lead:'The original coil is now the excitation coil, with a receiver coil on each side. Each receiver has its own voltmeter. Then wire the receivers against each other so a single voltmeter reads only their difference.',
 pq:'You drag the coil set to the right across the lengthwise cut. Which voltmeter deflects first?',po:['The left one','The right one','Both at the same moment'],pa:1,
 why:'On sound tube the eddy current stays under the excitation coil, so the receivers see almost nothing. When the excitation coil reaches the left end of the cut, the eddy current detours along the cut and flows partly under the right receiver, inducing a voltage there. At the right end of the cut it reaches the left receiver. The differential connection marks both ends of the cut on one meter. The circumferential cut still stays invisible.',
 controls:()=>`<div class="ctrl"><label>Receiver wiring</label>${seg('wiring',[['two','Two voltmeters'],['diff','Differential']],S.mode)}</div>`,
 bind(){bindSeg('wiring',v=>{S.mode=v;S.pv={};if(v==='diff')done('sw');});},
 tasks:[{id:'two',text:'With two voltmeters, drag the coil set across the lengthwise cut.'},{id:'sw',text:'Switch to the differential connection.'},{id:'dscan',text:'Drag across the cut again.'}],
 tick(){const has=(b)=>{for(let i=290;i<=394;i+=4)if(isNaN(b[i]))return false;return true;};if(has(S.bR))done('two');if(has(S.bD))done('dscan');}},
{scene:'sheet1',kicker:'Scene 5 · Surface probe',title:'A flat coil on a sheet',
 lead:'The test piece is now a stainless steel sheet with a saw cut through it. A surface coil sits flat on the surface. Drag the coil onto the sheet, then across the cut.',
 pq:'If you cross the cut moving top to bottom instead of left to right, the coil current will:',po:['Drop just the same','Not change at all','Rise'],pa:0,
 why:'Away from the sheet, self-induction keeps the current low. On the sheet, an eddy current flows right under the coil and its field lowers the coil\'s self-induction, so the current rises. Over the cut the eddy current must detour, it weakens, and the current drops. A round surface coil reacts the same way from either direction.',
 tasks:[{id:'on',text:'Place the coil on the sheet.'},{id:'lr',text:'Cross the cut moving left or right.'},{id:'tb',text:'Cross the cut moving top to bottom (or bottom to top).'}],
 tick(){if(S.g&&S.g.on>.95)done('on');if(S.crossLR)done('lr');if(S.crossTB)done('tb');}},
{scene:'sheet3',kicker:'Scene 6 · Surface probe',title:'Three coils side by side',
 lead:'The middle coil is the excitation coil and the outer two are receivers, each with its own voltmeter. Drag the coil set along the sheet and across the cut.',
 pq:'With the excitation coil on sound sheet, the receiver voltmeters will show:',po:['Exactly zero','A small voltage','Full scale'],pa:1,
 why:'The eddy current loop is slightly larger than the excitation coil, so part of its field always passes through the receivers and induces a small voltage. With the excitation coil just left of the cut, the detour sends much more field through the right receiver; just right of the cut, through the left one. The drawback of side-by-side coils is poor local resolution, so very small flaws are hard to find.',
 tasks:[{id:'park',text:'Hold the coils still on sound sheet and read both voltmeters.'},{id:'scan',text:'Drag the coil set across the cut.'}],
 tick(){if(S.still>1.4)done('park');let ok=true;for(let i=182;i<=320;i+=4)if(isNaN(S.bR[XO+i])){ok=false;break;}if(ok)done('scan');}},
{scene:'dcoil',kicker:'Scene 7 · Surface probe',title:'D-shaped receivers inside the excitation coil',
 lead:'Two D-shaped receiver coils now sit inside the excitation coil. Read each receiver on its own, then switch them against each other and read only the difference. Finally, rotate the probe 90 degrees.',
 pq:'After you rotate the probe 90 degrees, the difference signal over the cut will:',po:['Get stronger','Almost disappear','Stay the same'],pa:1,
 why:'Inside the excitation coil, each receiver picks up a large voltage everywhere, which hides the cut. Switching them against each other cancels that, leaving a small reading on sound sheet and strong swings on each side of the cut. The split between the Ds must run along the crack. Turned 90 degrees, the cut affects both Ds equally and the difference vanishes. If the crack direction is unknown, scan a second time with the probe rotated 90 degrees.',
 controls:()=>`<div class="ctrl"><label>Receivers</label>${seg('rx',[['sep','Separate'],['diff','Difference']],S.mode)}</div><div class="ctrl"><label>Probe rotation</label>${seg('rot',[['0','0°'],['90','90°']],String(S.rot))}</div>`,
 bind(){bindSeg('rx',v=>{S.mode=v;SC.dcoil.clear();});bindSeg('rot',v=>{S.rot=+v;SC.dcoil.clear();});},
 tasks:[{id:'sep',text:'Drag across the cut with separate receivers.'},{id:'diff',text:'Switch to Difference and drag across again.'},{id:'rot',text:'Rotate the probe 90° and drag across once more.'}],
 tick(){const s=SC.dcoil;if(s.covered('sep'))done('sep');if(s.covered('diff'))done('diff');if(s.covered('rot'))done('rot');}},
{scene:'imp',kicker:'Scene 8 · In practice',title:'Reading the impedance plane',final:true,
 lead:'Real instruments use tiny probes and show the signal as a dot on the impedance plane, like the right half of the screen in the bicycle crank arm inspection. This is a simplified display. Drag the probe; use the sliders for lift-off, phase and gain.',
 pq:'Lift-off and a crack both change the probe\'s impedance. On the impedance plane, the crack signal will move:',po:['Along the same line as lift-off','In a different direction from lift-off','Nowhere; only lift-off shows'],pa:1,
 why:'Lift-off and cracks move the dot in different directions. With lift-off rotated to horizontal, a probe wobble moves the dot sideways while a crack throws it upward, so the two are easy to tell apart. Machines in practice also test at several frequencies: changing frequency changes how deep the eddy currents reach, which helps estimate crack depth.',
 controls:()=>`<div class="ctrl"><label>Lift-off <b id="vl">${Math.round(S.lift*100)}%</b></label><input type="range" id="lift" min="0" max="1" step=".01" value="${S.lift}"></div><div class="ctrl"><label>Phase rotation <b id="vr">${S.rot}°</b></label><input type="range" id="rot" min="0" max="359" step="1" value="${S.rot}"></div><div class="ctrl"><label>Gain <b id="vg">${S.gain} dB</b></label><input type="range" id="gain" min="0" max="20" step="1" value="${S.gain}"></div><button class="btn small" id="erase">Erase screen</button>`,
 bind(){const L=$('#lift'),R=$('#rot'),G=$('#gain');if(!L)return;L.oninput=()=>{S.lift=+L.value;$('#vl').textContent=Math.round(S.lift*100)+'%';};R.oninput=()=>{S.rot=+R.value;$('#vr').textContent=S.rot+'°';};G.oninput=()=>{S.gain=+G.value;$('#vg').textContent=S.gain+' dB';};$('#erase').onclick=()=>{S.tr=[];S.yt=[];};},
 tasks:[{id:'lift',text:'Lift the probe off the plate and watch the dot.'},{id:'rot',text:'Rotate the phase until lift-off moves the dot straight to the left.'},{id:'crack',text:'Set the probe back down and drag it across the crack.'}],
 tick(){if(S.lift>.7)done('lift');const d=Math.abs(((SC.imp.liftAng()-180)+540)%360-180);S.rotOK=d<10;if(S.rotOK)done('rot');if(S.swept&&state[cur].tasks.rot)done('crack');}}
];

/* ---------- step engine: predict, test, reveal ---------- */
let cur=0,state=STEPS.map(()=>({pred:null,tasks:{},rev:false}));
const tasksDone=(i=cur)=>STEPS[i].tasks.every(t=>state[i].tasks[t.id]);
const stepDone=(i=cur)=>state[i].pred!==null&&state[i].rev;
function done(id){const st=state[cur];if(st.pred===null||st.tasks[id])return;st.tasks[id]=true;const el=panel.querySelector(`[data-t="${id}"]`);if(el)el.classList.add('ok');if(tasksDone()&&!st.rev){const at=cur;setTimeout(()=>{if(cur===at){st.rev=true;renderPanel();panel.scrollTop=panel.scrollHeight;}},500);}updateNav();}
function renderPanel(){const s=STEPS[cur],st=state[cur];let h=`<div class="kicker">${s.kicker}</div><h1>${s.title}</h1><p class="lead">${s.lead}</p>`;
 h+=`<div class="pq"><div class="kicker">Predict first</div><div class="q">${s.pq}</div>${s.po.map((o,j)=>{let c='';if(st.pred!==null){if(st.rev){if(j===s.pa)c='right';else if(j===st.pred)c='wrong';}else if(j===st.pred)c='pick';}return`<button class="opt ${c}" data-j="${j}" ${st.pred!==null?'disabled':''}>${o}</button>`;}).join('')}${st.pred===null?'<div class="note">Pick an answer to unlock the scene.</div>':st.rev?'':'<div class="note">Locked in. Now test it.</div>'}</div>`;
 if(st.pred!==null){if(s.controls)h+=s.controls();h+=`<div class="tasks">${s.tasks.map(t=>`<div class="task ${st.tasks[t.id]?'ok':''}" data-t="${t.id}"><i></i><span>${t.text}</span></div>`).join('')}</div>`;}
 if(st.rev){const ok=st.pred===s.pa;h+=`<div class="quiz"><div class="kicker">What happened</div><div class="fb ${ok?'ok':'no'}">${ok?'Your prediction was right.':'Not what you predicted. Here is why.'}</div><p class="lead">${s.why}</p></div>`;
  if(s.final){const sc=STEPS.filter((x,i)=>state[i].pred===x.pa).length;h+=`<div class="quiz"><div class="kicker">Your predictions</div><div class="big">${sc} / ${STEPS.length}</div><div class="lead">correct before testing.</div><button class="btn primary small" id="restart">Start over</button></div>`;}}
 panel.innerHTML=h;panel.scrollTop=0;
 panel.querySelectorAll('.pq .opt').forEach(b=>b.onclick=()=>{if(st.pred!==null)return;st.pred=+b.dataset.j;renderPanel();});
 if(st.pred!==null&&s.bind)s.bind();const rs=$('#restart');if(rs)rs.onclick=restart;updateNav();}
function updateNav(){$('#dots').innerHTML=STEPS.map((s,i)=>`<div class="dot ${i===cur?'cur':stepDone(i)?'done':''}"></div>`).join('');$('#back').disabled=cur===0;const last=cur===STEPS.length-1;$('#next').style.visibility=last?'hidden':'visible';$('#next').disabled=!stepDone();
 const st=state[cur];$('#hint').textContent=st.pred===null?'Make your prediction to start':!tasksDone()?'Complete the tasks to continue':stepDone()?(last?'':'Nice. Continue when ready.'):'';}
function go(i){cur=clamp(i,0,STEPS.length-1);SC[STEPS[cur].scene].init();renderPanel();}
function restart(){state=STEPS.map(()=>({pred:null,tasks:{},rev:false}));go(0);}
$('#next').onclick=()=>{if(stepDone())go(cur+1);};$('#back').onclick=()=>go(cur-1);

/* ---------- input + loop ---------- */
const scene=()=>SC[STEPS[cur].scene];
const live=()=>state[cur].pred!==null;
cv.addEventListener('pointerdown',e=>{const s=scene();if(live()&&s.down){s.down(toL(e));try{cv.setPointerCapture(e.pointerId);}catch(_){}}});
cv.addEventListener('pointermove',e=>{const s=scene(),p=toL(e);if(live()&&s.move)s.move(p);cv.style.cursor=!live()?'default':S.drag?'grabbing':(s.over&&s.over(p)?'grab':'default');});
const up=()=>{const s=scene();if(s.up)s.up();};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
let last=performance.now();
function frame(t){const dt=clamp((t-last)/1000,.001,.05);last=t;const s=scene();s.upd(dt);const st=STEPS[cur];if(live()&&st.tick)st.tick();
 const v=view;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(v.d*v.s,0,0,v.d*v.s,v.d*v.ox,v.d*v.oy);s.draw();
 if(!live()){ctx.fillStyle='rgba(255,255,255,.72)';ctx.fillRect(-2000,-2000,W+4000,H+4000);rr(W/2-190,H/2-30,380,60,30);ctx.fillStyle='#111';ctx.fill();txt('Make your prediction first',W/2,H/2,{c:'#fff',w:650,size:18,al:'center'});}
 requestAnimationFrame(frame);}

/* ---------- start screen + full screen ---------- */
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const isFS=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function enterFS(){const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(!f)return;try{const r=f.call(el);if(r&&r.catch)r.catch(()=>{});}catch(_){}}
function exitFS(){const f=document.exitFullscreen||document.webkitExitFullscreen;if(!f)return;try{const r=f.call(document);if(r&&r.catch)r.catch(()=>{});}catch(_){}}
const fsb=$('#fsb');if(!fsOK)fsb.style.display='none';else $('#fsnote').textContent='Opens full screen. Press Esc to exit.';
fsb.onclick=()=>isFS()?exitFS():enterFS();
const fsUpd=()=>{fsb.textContent=isFS()?'Exit full screen':'Full screen';};
document.addEventListener('fullscreenchange',fsUpd);document.addEventListener('webkitfullscreenchange',fsUpd);
$('#startbtn').onclick=()=>{if(fsOK)enterFS();$('#start').remove();};
window.__ec={go:i=>go(i),state:()=>state,S:()=>S,predict:j=>{state[cur].pred=j;renderPanel();}};
go(0);requestAnimationFrame(frame);
})();
</script>
</body>
</html>
