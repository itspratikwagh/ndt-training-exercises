<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UT Epoch Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="epoch650/sim.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Ultrasonic Testing · Level I · Epoch 650 Trainer</div>
    <h1>Range: How Much Sound Path Fits on the Screen</h1>
    <a class="back" href="index.html">← Exercise Hub</a>
  </div>
</header>
<main class="wrap" id="app"></main>
<script src="epoch650/sim.js"></script>
<script>
(function () {
  const E = Epoch650;
  // Range targets: the first two are "set it, then count"; the rest are "guess first, then set it to check".
  const ROWS = [
    { R: 0.700, mode: 'observe' }, { R: 1.100, mode: 'observe' },
    { R: 1.600, mode: 'predict' }, { R: 2.100, mode: 'predict' }, { R: 3.100, mode: 'predict' }, { R: 5.100, mode: 'predict' }
  ];
  const READ_RANGES = [2.500, 0.700, 4.000];   // last part: change the range a few times while watching the reading
  const calibrated = extra => Object.assign({ vel: 0.2320, zero: 0.500, range: 1.000, gain: 42.7, probe: null, g1: { start: 0.450, width: 0.100, level: 40 } }, extra);
  const at = (st, R) => Math.abs(st.range - R) < 5e-4;
  const count = st => E.visibleBackwalls(st).length;
  const plural = n => n === 1 ? 'echo' : 'echoes';
  const freshQ = () => ({ row: -1, phase: 'idle', guess: null, tries: 0, fb: '', results: {}, rd: -1, readings: {}, rdDone: false, final: null });
  let q = freshQ(), tr = null, card = null;

  // Plain-language reason, no arithmetic: echoes come every 0.5 in; only those inside the screen show.
  function explain(R, seen) {
    const pos = k => (0.5 * k).toFixed(1);
    const fits = seen === 1 ? 'only the echo at 0.5 in fits' : seen === 2 ? 'the echoes at 0.5 and 1.0 in fit' : `the echoes at 0.5, 1.0 … up to ${pos(seen)} in fit`;
    return `Back-wall echoes from the 0.500 in step come every 0.5 in: at 0.5, 1.0, 1.5 in and so on. The screen now shows 0 to ${R.toFixed(1)} in, so ${fits}. The next one, at ${pos(seen + 1)} in, is past the right edge of the screen.`;
  }

  const steps = [
    { text: 'Drag the probe onto the <b>0.500 in</b> step of the block.', place: 0.5, keys: [], check: st => st.probe === 0.5 },
    { text: 'Press <b>F1</b> to open the <b>Basic</b> menu.', keys: ['F1'], check: st => st.menu === 'Basic' || q.row >= 0 },
    { text: 'Press <b>P3</b> to select <b>Range</b>. Each knob click now changes Range by 0.01 in.', keys: ['P3'], check: st => st.sel === 'range' || q.row >= 0 },
    ...ROWS.map((r, i) => ({
      text: (st, api, done) => {
        const res = q.results[i];
        if (done && res) return `Range <b>${r.R.toFixed(3)} in</b>: ${res.seen} back-wall ${plural(res.seen)} ${res.correct ? '<span class="ok">✓</span>' : ''}`;
        return r.mode === 'observe'
          ? `Turn the knob to Range <b>${r.R.toFixed(3)} in</b>, then answer the question on the instrument.`
          : `Answer the question on the instrument first, then turn the knob to Range <b>${r.R.toFixed(3)} in</b> to check.`;
      },
      keys: () => q.row === i && q.phase === 'turn' ? ['KNOB'] : [],
      check: () => !!(q.results[i] && q.results[i].done)
    })),
    {
      text: (st, api, done) => done
        ? `Thickness reading at 3 ranges: ${READ_RANGES.map((R, i) => q.readings[i]).join(', ')} in`
        : `Watch the glowing <b>G1 THICKNESS</b> box while you change the Range to <b>2.500</b>, <b>0.700</b> and <b>4.000 in</b>.` + (q.rd > 0 ? ` <span class="ok">(${Object.keys(q.readings).length} of 3)</span>` : ''),
      keys: () => q.phase === 'rturn' ? ['KNOB'] : [],
      check: () => q.rdDone
    },
    { text: 'Answer the last question on the instrument.', keys: [], check: () => q.final === 'no' }
  ];

  function startRow(i) { q.row = i; q.guess = null; q.tries = 0; q.fb = ''; q.phase = ROWS[i].mode === 'observe' ? 'turn' : 'ask'; }
  function sync(st) {
    if (q.row === -1 && st.probe === 0.5 && st.sel === 'range') startRow(0);
    if (q.phase === 'rturn' && at(st, READ_RANGES[q.rd])) { const rd = E.reading(st); q.readings[q.rd] = rd == null ? '----' : rd.toFixed(3); q.phase = 'rnote'; }
    const r = ROWS[q.row];
    if (r && q.phase === 'turn' && at(st, r.R)) {
      if (r.mode === 'observe') q.phase = 'ask';
      else { const seen = count(st); q.results[q.row] = { seen, guess: q.guess, correct: q.guess === seen }; q.phase = 'reveal'; }
    }
    render(st);
  }
  function answer(n) {
    const st = tr.state, i = q.row, r = ROWS[i];
    if (r.mode === 'predict') { q.guess = n; q.phase = 'turn'; tr.poke(); return; }
    const seen = count(st);
    if (n === seen) { q.results[i] = { seen, guess: n, correct: q.tries === 0 }; q.phase = 'reveal'; }
    else if (++q.tries >= 2) { q.results[i] = { seen, guess: n, correct: false }; q.phase = 'reveal'; }
    else q.fb = `<span class="no">Not quite.</span> Count the glowing arrows again. Each arrow points at one back-wall echo.`;
    tr.poke();
  }
  function next() {
    q.results[q.row].done = true;
    if (q.row + 1 < ROWS.length) startRow(q.row + 1); else q.phase = 'rintro';
    tr.poke();
  }
  // Last part: watch the thickness reading while the range changes
  function readAct(what, val) {
    if (what === 'start') { q.rd = 0; q.phase = 'rturn'; }
    if (what === 'next') { if (q.rd + 1 < READ_RANGES.length) { q.rd++; q.phase = 'rturn'; } else { q.rdDone = true; q.phase = 'final'; q.fb = ''; } }
    if (what === 'final') {
      if (val === 'no') { q.final = 'no'; q.phase = 'end'; }
      else q.fb = '<span class="no">Look at your notes above.</span> The box read the same number at every range.';
    }
    tr.poke();
  }
  function notes() {
    const rows = READ_RANGES.map((R, i) => q.readings[i] == null ? '' : `<tr><td>Range ${R.toFixed(3)} in</td><td><b>${q.readings[i]} in</b></td></tr>`).join('');
    return rows ? `<table class="ws" style="margin-top:8px"><tbody>${rows}</tbody></table>` : '';
  }

  function render(st) {
    if (!card) return;
    const i = q.row, r = ROWS[i], label = r ? `Range ${i + 1} of ${ROWS.length}` : '';
    const nums = `<div class="nums">${Array.from({ length: 10 }, (_, k) => `<button data-n="${k + 1}">${k + 1}</button>`).join('')}</div>`;
    let el;
    if (q.phase === 'idle') { card.hide(); return; }
    if (q.phase === 'turn') {
      el = card.show(`<div class="ql">${label}</div><div class="qq">${r.mode === 'predict' ? `Your guess: <b>${q.guess}</b>. ` : ''}Turn the knob to Range <b>${r.R.toFixed(3)} in</b>.</div><div class="qs">Now: ${st.range.toFixed(3)} in · hold the knob to turn faster</div>`, true);
    } else if (q.phase === 'ask' && r.mode === 'observe') {
      el = card.show(`<div class="ql">${label} · Range ${r.R.toFixed(3)} in</div><div class="qq">How many back-wall echoes do you see now?</div><div class="qs">The glowing arrows point at them.</div>${nums}<div class="fb">${q.fb}</div>`);
    } else if (q.phase === 'ask') {
      el = card.show(`<div class="ql">${label} · guess first</div><div class="qq">You're about to set Range to <b>${r.R.toFixed(3)} in</b>. How many back-wall echoes will you see?</div><div class="qs">The knob unlocks after you answer.</div>${nums}`);
    } else if (q.phase === 'reveal') {
      const res = q.results[i];
      const verdict = r.mode === 'predict'
        ? (res.correct ? `<span class="ok">Your guess of ${res.guess} was right.</span>` : `<span class="no">You guessed ${res.guess}.</span>`)
        : (res.correct ? '<span class="ok">Right.</span>' : '<span class="no">Count the numbered arrows.</span>');
      el = card.show(`<div class="ql">${label} · Range ${r.R.toFixed(3)} in</div><div class="qq"><span class="big">${res.seen}</span> back-wall ${plural(res.seen)} on screen</div><div class="fb">${verdict}</div><div class="ex">${explain(r.R, res.seen)}</div><button class="go" data-next>${i + 1 < ROWS.length ? 'Next →' : 'Finish →'}</button>`);
    } else if (q.phase === 'rintro') {
      const rd = E.reading(st);
      el = card.show(`<div class="ql">One more thing to watch</div><div class="qq">Look at the glowing <b>G1 THICKNESS</b> box at the top of the screen.</div><div class="ex">Gate 1 (the red line) sits on the first back-wall echo, and this box shows the thickness it measures: <b>${rd == null ? '----' : rd.toFixed(3)} in</b>. Keep your eye on it while you change the Range a few more times.</div><button class="go" data-read="start">Got it →</button>`);
    } else if (q.phase === 'rturn') {
      el = card.show(`<div class="ql">Watch the reading · ${q.rd + 1} of ${READ_RANGES.length}</div><div class="qq">Turn the knob to Range <b>${READ_RANGES[q.rd].toFixed(3)} in</b>.</div><div class="qs">Now: ${st.range.toFixed(3)} in. Watch the echo move, and watch the G1 THICKNESS box.</div>`, true);
    } else if (q.phase === 'rnote') {
      el = card.show(`<div class="ql">Range ${READ_RANGES[q.rd].toFixed(3)} in</div><div class="qq">G1 THICKNESS reads <span class="big">${q.readings[q.rd]}</span> in</div>${notes()}<button class="go" data-read="next">${q.rd + 1 < READ_RANGES.length ? 'Next range →' : 'Continue →'}</button>`);
    } else if (q.phase === 'final') {
      el = card.show(`<div class="ql">Last question</div><div class="qq">Did the G1 THICKNESS reading change when you changed the Range?</div>${notes()}<div class="yn"><button data-final="yes">Yes</button><button data-final="no">No</button></div><div class="fb">${q.fb}</div>`);
    } else if (q.phase === 'end') {
      el = card.show(`<div class="ql">Exercise complete</div><div class="qq"><span class="ok">Right. It stayed ${q.readings[0]} in.</span></div><div class="ex">A bigger Range fits more back-wall echoes on the screen, and the echoes slide left or right as the screen gets wider or narrower. But the back wall is still 0.500 in below the probe, so the reading doesn't change. Range changes what you see, not what you measure.</div>`);
    }
    el.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => answer(+b.dataset.n)));
    const nx = el.querySelector('[data-next]'); if (nx) nx.addEventListener('click', next);
    el.querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', () => readAct(b.dataset.read)));
    el.querySelectorAll('[data-final]').forEach(b => b.addEventListener('click', () => readAct('final', b.dataset.final)));
  }

  const guard = E.fixedStepRangeGuard({
    locked: () => q.row < 0 ? null : { ask: 'Answer the question first', final: 'Answer the question first', reveal: 'Press Next on the card to continue', rnote: 'Press Next on the card to continue', rintro: 'Press Got it on the card first' }[q.phase] || null,
    target: () => q.phase === 'turn' ? ROWS[q.row].R : q.phase === 'rturn' ? READ_RANGES[q.rd] : null
  });
  const arrows = () => q.phase === 'ask' && ROWS[q.row] && ROWS[q.row].mode === 'observe' ? { numbered: false } : q.phase === 'reveal' ? { numbered: true } : null;

  // ---- Lesson video (first draft, parked for revision) ----
  const ROWS_V = [0.700, 1.100, 3.100, 5.100];
  const cards = {
    what(ctx, b, st, t, h) {
      h.txt(ctx, 'RANGE', b.x + 18, b.y + 38, { size: 22, weight: 800, color: '#2a6fdb' });
      h.txt(ctx, 'Basic menu · P3', b.x + 110, b.y + 38, { size: 13, weight: 700, color: '#8f8882', mono: true });
      bullets(ctx, h, b, ['The distance shown across the screen, left edge to right edge.', 'Measured in inches of sound path in steel.', 'It changes the view — not the part.']);
    },
    table(ctx, b, st, t, h) {
      h.txt(ctx, 'Echoes on screen', b.x + 18, b.y + 34, { size: 19, weight: 800, color: '#1f1d1b' });
      h.txt(ctx, '≈ Range ÷ thickness (0.500)', b.x + 18, b.y + 58, { size: 14, weight: 700, color: '#2a6fdb' });
      const seen = new Set(st.events.filter(e => e.name === 'turn' && e.key === 'range').map(e => e.value.toFixed(3)));
      ['RANGE', '÷ 0.500', 'SEEN'].forEach((c, i) => h.txt(ctx, c, b.x + 18 + i * 96, b.y + 92, { size: 11, weight: 700, color: '#8f8882', mono: true }));
      ROWS_V.forEach((R, i) => {
        const y = b.y + 122 + i * 34, on = seen.has(R.toFixed(3));
        h.txt(ctx, R.toFixed(3), b.x + 18, y, { size: 16, weight: 700, color: '#1f1d1b', mono: true });
        if (on) {
          h.txt(ctx, (R / 0.5).toFixed(1), b.x + 114, y, { size: 16, weight: 700, color: '#57524d', mono: true });
          h.txt(ctx, String(Math.floor(R / 0.5)), b.x + 210, y, { size: 18, weight: 800, color: '#0d904f', mono: true });
        }
      });
    },
    reading(ctx, b, st, t, h) {
      h.txt(ctx, 'G1 THICKNESS', b.x + 18, b.y + 38, { size: 13, weight: 700, color: '#d93025', mono: true });
      const r = h.reading();
      h.txt(ctx, r == null ? '----' : r.toFixed(3) + ' in', b.x + 18, b.y + 86, { size: 36, weight: 800, color: '#1f1d1b', mono: true });
      bullets(ctx, h, { x: b.x, y: b.y + 70, w: b.w }, ['Same reading at every range.', 'Range does not move the back wall.', 'It only zooms the time base in or out.']);
    },
    use(ctx, b, st, t, h) {
      h.txt(ctx, 'Choosing a range', b.x + 18, b.y + 36, { size: 19, weight: 800, color: '#1f1d1b' });
      bullets(ctx, h, b, ['Small range: one echo, spread out, easy to see.', 'Large range: several back-wall echoes.', 'Two-back-wall calibration needs the 2nd echo on screen.']);
    }
  };
  function bullets(ctx, h, b, arr) {
    let y = b.y + 76;
    arr.forEach(s => { h.font(ctx, 15, 600); const ls = h.wrap(ctx, s, b.w - 56); ctx.fillStyle = '#2a6fdb'; ctx.beginPath(); ctx.arc(b.x + 24, y - 5, 4, 0, 7); ctx.fill(); ls.forEach((l, i) => h.txt(ctx, l, b.x + 38, y + i * 20, { size: 15, weight: 600, color: '#1f1d1b' })); y += ls.length * 20 + 12; });
  }

  const video = {
    num: '01', title: 'Range: how much sound path fits on the screen',
    initial: () => E.makeState(calibrated({ menu: 'Receiver', probe: 0.500, stepIdx: { range: 2 } })),  // parked draft video: keeps its original 0.1 in knob step
    cards,
    cues: [
      { say: 'Range sets how much sound path the Epoch shows across the screen, from the left edge to the right edge.', card: 'what' },
      { say: 'We are calibrated on the steel step block, with the probe sitting on the 0.500 inch step.' },
      { say: 'Range is 1.000 inch right now. The first back-wall echo is in the middle of the screen, at 0.500, and the second one is right on the right edge.' },
      { say: 'To change it, press F1 for the Basic menu, then P3 to select Range.', do: [[1.6, 'F1'], [3.2, 'P3']] },
      { say: 'The Range box is highlighted, so the knob now changes Range. The small delta shows the knob step: 0.100 inch per click.' },
      { say: 'Turn the knob down to 0.700 inch.', do: [[0.8, ['knob', -3, 0.3]]], card: 'table' },
      { say: 'Now only one back-wall echo fits. Range divided by thickness: 0.7 divided by 0.5 is 1.4, so one whole echo.' },
      { say: 'Turn it up to 1.100 inch. Two echoes fit now, because 1.1 divided by 0.5 is 2.2.', do: [[0.6, ['knob', 4, 0.3]]] },
      { say: 'For a big change, press the check key so each click is 1.000 inch, then turn up to 3.100.', do: [[1.8, 'CHECK'], [3.4, ['knob', 2, 0.45]]] },
      { say: 'Six echoes. Each one is another round trip through the 0.500 inch step, so they are spaced 0.500 apart.' },
      { say: 'Each echo is a little shorter than the one before. Every trip loses some energy to attenuation and at the surface.' },
      { say: 'Now 5.100 inches. Ten echoes. The last ones are small, but they are still there.', do: [[0.8, ['knob', 2, 0.45]]] },
      { say: 'Now look at the Gate 1 thickness reading. It said 0.500 inch the whole time.', card: 'reading' },
      { say: 'Range did not move the back wall and did not change the thickness. It only changed how much of the time base fits on the screen, like zooming a map in or out.' },
      { say: 'Increasing the range does not create new echoes. It lets you see more of the sound path.' },
      { say: 'A small range spreads one echo out so you can see it clearly. A large range shows several back-wall echoes, which you need for a two-back-wall calibration.', card: 'use' },
      { say: 'Now try it yourself. Predict how many echoes you will see first, then set the range and count them.', hold: 1.5 }
    ]
  };

  E.page({
    lede: 'Range is the distance shown across the Epoch screen. Change it and see how many back-wall echoes from the 0.500&nbsp;in step fit on the screen, and what happens to the thickness reading.',
    tryIntro: 'The Epoch is already calibrated for the steel step block. Follow the steps on the right; the keys you need next glow yellow, and questions pop up on the instrument.',
    video,
    trainerInitial: () => calibrated({ menu: 'Receiver', stepIdx: { range: 1 } }),
    steps, guard, arrows,
    highlight: () => ['rintro', 'rturn', 'rnote', 'final', 'end'].includes(q.phase) ? 'thickness' : null,
    helpline: 'Drag the probe onto the block. Click keys to press them. Turn the knob by clicking its left or right half; hold it down to turn faster. You can also scroll over the knob.',
    onPlace(st, th) { if (th !== 0.5) { E.toast(st, 'This lesson uses the 0.500 in step. Drag the probe there.', 'warn'); return false; } },
    doneText: 'Range changes what you see, not what you measure.',
    keyPoints: `<ul>
      <li><b>Range</b> (Basic menu, P3) is the distance shown across the screen, from the left edge to the right edge.</li>
      <li>On the 0.500&nbsp;in step, back-wall echoes come every 0.5&nbsp;in: at 0.5, 1.0, 1.5&nbsp;in and so on. Only the ones that fall inside the screen show up.</li>
      <li>At Range 0.700&nbsp;in only the echo at 0.5 fits; the second one, at 1.0, is off the screen. At 1.100&nbsp;in, the echoes at 0.5 and 1.0 both fit.</li>
      <li>Each later echo is smaller, because the sound has traveled farther and lost more energy along the way.</li>
      <li>Range <b>does not</b> change the reading. The echoes slide across the screen, but the back wall is still 0.500&nbsp;in away, so the G1 THICKNESS box stays 0.500&nbsp;in at every range.</li>
      <li>Use a small range to spread one echo out, and a large range to see several back walls (for example, for a two-back-wall calibration).</li></ul>`,
    onReset() { q = freshQ(); },
    extra(el, trainer) {
      tr = trainer; card = E.questionCard();
      tr.onChange(st => sync(st));
      sync(tr.state);
    }
  });
})();
</script>
</body>
</html>
